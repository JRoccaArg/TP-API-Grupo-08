spring.application.name=zenoirprod

# ---------------------------------------------------------------------------
# Perfil activo. Se puede pisar sin tocar este archivo:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
#   (o con la variable de entorno SPRING_PROFILES_ACTIVE=dev)
#
#   dev         -> base H2 en memoria, no requiere instalar nada.
#   sqlsrv      -> SQL Server local.
# ---------------------------------------------------------------------------
spring.profiles.active=${SPRING_PROFILES_ACTIVE:sqlsrv}

# Configuracion de JPA / Hibernate comun a todos los perfiles
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Tamaño máximo de los archivos que se pueden subir: 10 MB por imagen (la subida es de a un archivo por pedido)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Un numero con decimales (por ejemplo cantidad 1.5) en un campo entero se rechaza en lugar de truncarse en silencio.
spring.jackson.deserialization.accept-float-as-int=false

# Una ruta inexistente lanza NoHandlerFoundException (la toma ManejadorErrores) en lugar del 404 sin mensaje de Spring.
# No hay recursos estaticos que servir, por eso se desactiva el mapeo de recursos.
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Reserva de entradas: las entradas quedan apartadas desde que se agregan al carrito.
# Armado: minutos que se aseguran desde la primera entrada (no se renuevan al agregar mas).
# Pago: minutos que tiene el usuario desde que entra a la pantalla de pago (reloj nuevo).
# Pasado el tiempo el carrito queda ABANDONADO, se vacia y las entradas vuelven a estar disponibles.
carrito.armado-minutos=15
carrito.pago-minutos=15

# Eventos: cada cuantos milisegundos se pasan a FINALIZADO los eventos activos cuya fecha de fin ya llego
# (y a los cuantos ms de arrancar corre la primera vez). Alcanza con una vez por hora: la compra se frena sola, en el
# momento, al llegar la fecha de fin; esto solo actualiza el estado que se muestra.
eventos.finalizacion-ms=3600000
eventos.finalizacion-inicial-ms=5000
