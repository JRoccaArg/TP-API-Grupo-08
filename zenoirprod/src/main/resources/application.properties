spring.application.name=zenoirprod

# ---------------------------------------------------------------------------
# Perfil activo. Se puede pisar sin tocar este archivo:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
#   (o con la variable de entorno SPRING_PROFILES_ACTIVE=dev)
#
#   dev    -> base H2 en memoria, no requiere instalar nada. Arranca siempre.
#   sqlsrv -> SQL Server local (lo que veniamos usando).
# ---------------------------------------------------------------------------
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Configuracion de JPA / Hibernate comun a todos los perfiles
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Define el tamaño máximo de los archivos que se pueden subir (-1 significa sin límite)
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1
