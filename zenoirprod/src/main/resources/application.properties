spring.application.name=zenoirprod

# Perfil activo. Se puede cambiar sin tocar este archivo:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev   (o con la variable SPRING_PROFILES_ACTIVE=dev)
#   dev    -> H2 en memoria, no requiere instalar nada
#   sqlsrv -> SQL Server local
spring.profiles.active=${SPRING_PROFILES_ACTIVE:sqlsrv}

# JPA / Hibernate (común a todos los perfiles)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Tamaño máximo de las imágenes que se suben: 10 MB (de a un archivo por pedido)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Un número con decimales (por ejemplo cantidad 1.5) en un campo entero se rechaza en vez de truncarse
spring.jackson.deserialization.accept-float-as-int=false

# Una ruta inexistente lanza NoHandlerFoundException (la toma ManejadorErrores) en vez del 404 sin mensaje de Spring.
# No hay recursos estáticos que servir, por eso se desactiva el mapeo de recursos.
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Reserva de entradas: quedan apartadas desde que se agregan al carrito.
# armado-minutos: desde la primera entrada (no se renueva al agregar más). pago-minutos: desde que entra a la pantalla de pago.
# Pasado el tiempo el carrito queda ABANDONADO, se vacía y las entradas vuelven a estar disponibles.
carrito.armado-minutos=15
carrito.pago-minutos=15

# Cada cuántos ms se pasan a FINALIZADO los eventos activos cuya fecha de fin ya llegó (y a los cuántos ms de arrancar corre
# la primera vez). Alcanza con una vez por hora: la compra se frena sola al llegar la fecha de fin, esto solo actualiza el estado.
eventos.finalizacion-ms=3600000
eventos.finalizacion-inicial-ms=5000

# Mail con las entradas (JavaMail): al confirmar una compra se le mandan al comprador sus entradas con los QR.
# Por defecto está apagado: no se manda nada y solo queda anotado en el log (así el proyecto y los tests corren sin credenciales).
# Para mandar de verdad se definen estas variables de entorno (ver README):
#   ZENOIR_MAIL_ACTIVO=true
#   ZENOIR_MAIL_USUARIO=la-cuenta@gmail.com      (desde donde salen los mails)
#   ZENOIR_MAIL_CLAVE=contraseña-de-aplicacion   (la de aplicación de Gmail, no la normal)
# Viene listo para Gmail; con otro proveedor se cambian también ZENOIR_MAIL_HOST y ZENOIR_MAIL_PUERTO.
# ZENOIR_FRONT_URL es la dirección del front: va en el QR (/verificar/<código>) y en el botón "Ver mis entradas".
zenoir.mail.activo=${ZENOIR_MAIL_ACTIVO:false}
zenoir.mail.remitente=${ZENOIR_MAIL_USUARIO:}
zenoir.front.url=${ZENOIR_FRONT_URL:http://localhost:5173}
spring.mail.host=${ZENOIR_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${ZENOIR_MAIL_PUERTO:587}
spring.mail.username=${ZENOIR_MAIL_USUARIO:}
spring.mail.password=${ZENOIR_MAIL_CLAVE:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# El chequeo de salud (actuator) no prueba el correo: sin credenciales daría "caído" sin motivo.
management.health.mail.enabled=false
