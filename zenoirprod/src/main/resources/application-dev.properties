# Perfil dev: base H2 en memoria. No hace falta instalar SQL Server ni configurar nada: el proyecto levanta solo.
# Ojo: los datos se pierden al apagar la aplicación.

spring.datasource.url=jdbc:h2:mem:zenoir;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web para mirar la base: http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:mem:zenoir | User: sa | Password: vacía)
spring.h2.console.enabled=true

# Versión de la expo: al arrancar se cargan solos los datos de la expo (cuentas, eventos con fotos, lugares y compras).
# Hibernate crea las tablas primero y después Spring corre el script. Cada vez que se reinicia vuelve a quedar igual.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:expo/expo-h2.sql
spring.sql.init.encoding=UTF-8
