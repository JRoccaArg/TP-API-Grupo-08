# Perfil dev: base H2 en memoria.
# No hace falta instalar SQL Server ni configurar nada: el proyecto levanta solo.
# Ojo: los datos se pierden al apagar la aplicacion.

spring.datasource.url=jdbc:h2:mem:zenoir;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web para mirar la base: http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:mem:zenoir | User: sa | Password: vacia)
spring.h2.console.enabled=true
