# Perfil exclusivo de la rama de exposicion: SQL Server + precarga del oral.
# Trae por defecto la conexion local de la demo (misma que la rama main), asi
# arranca sin configurar nada en la maquina del oral. Igual se puede pisar
# cualquier valor con variables de entorno (DB_HOST, DB_PORT, DB_NAME, DB_USER,
# DB_PASSWORD) o con SPRING_DATASOURCE_URL para una instancia con nombre.
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:Zenoir_Prod};encrypt=true;trustServerCertificate=true;
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:UFUchm4vP1cPz8BWbVy6}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# La demo recrea el esquema en cada arranque (pisa el ddl-auto=update comun).
# Asi la base queda limpia y con la precarga completa, sin chocar con tablas
# viejas de corridas anteriores. Cada arranque borra y vuelve a cargar todo.
spring.jpa.hibernate.ddl-auto=create
