# Perfil sqlsrv: SQL Server local.
# Cada uno puede pisar host, puerto, base, usuario y password con variables de
# entorno, sin editar este archivo ni generar conflictos en git.

spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:Zenoir_Prod};encrypt=true;trustServerCertificate=true;
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
